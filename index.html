<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lunch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Campus Lunch</h1>
    <p class="subtitle" id="subtitle">Monday's menu</p>
  </header>

  <main>
    <form class="controls">
      <label for="day-select">Day</label>
      <select id="day-select" name="day">
        <option value="Monday" selected>Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
      </select>
    </form>

    <p id="meal-count" class="meal-count" aria-live="polite"></p>

    <section aria-label="Meals for the selected day">
      <ul id="meal-list" class="meal-list">
        <!-- Meal cards are inserted here by app.js -->
      </ul>
    </section>
  </main>

  <footer>
    <p>Sample data for a classroom exercise. Not a real cafeteria menu.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
